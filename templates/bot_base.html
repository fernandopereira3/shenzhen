{% extends 'base.html' %}
{% load bots %}
{% block content %}
  <div class="bot-layout" data-inicial="{% block secao_inicial %}{% endblock %}">
    <aside class="bot-lateral">
      {% painel_bot %}
      <nav class="bot-secoes" aria-label="Seções da página">
        <ul>{% block secoes %}{% endblock %}</ul>
      </nav>
    </aside>
    <div class="bot-conteudo">
      {% block bot_conteudo %}{% endblock %}
    </div>
  </div>
  <script>
    // Links do painel viram abas: o conteúdo mostra só a seção escolhida.
    // Sem JS, tudo aparece de uma vez e os links só rolam até a seção.
    (() => {
      const layout = document.querySelector('.bot-layout');
      const links = [...layout.querySelectorAll('.bot-secoes a[href^="#sec-"]')];
      const secoes = [...layout.querySelectorAll('.bot-conteudo > [id^="sec-"]')];
      if (!links.length) return;
      layout.classList.add('abas');
      const mostrar = (id) => {
        if (!secoes.some((s) => s.id === id)) id = secoes[0].id;
        secoes.forEach((s) => { s.hidden = s.id !== id; });
        links.forEach((a) => {
          if (a.hash === '#' + id) a.setAttribute('aria-current', 'true');
          else a.removeAttribute('aria-current');
        });
      };
      links.forEach((a) => a.addEventListener('click', (e) => {
        e.preventDefault();
        history.replaceState(null, '', a.hash);
        mostrar(a.hash.slice(1));
      }));
      mostrar(location.hash.slice(1) || layout.dataset.inicial);
    })();
  </script>
{% endblock %}

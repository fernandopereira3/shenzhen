services:
  shenzhen:
    image: fernandopereira3/shenzhen:latest
    env_file: .env
    ports:
      - "8000:8000"
    platform: linux/arm64
    volumes:
      - shenzhen-data:/data
    restart: unless-stopped

volumes:
  shenzhen-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/samba/programas/Volumes/shenzhen